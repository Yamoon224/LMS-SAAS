name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm arch:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    name: Integration tests (backend)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas_lms
          POSTGRES_PASSWORD: saas_lms_dev
          POSTGRES_DB: saas_lms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas_lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://saas_lms:saas_lms_dev@localhost:5432/saas_lms_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend db:generate
      - run: pnpm --filter backend db:migrate:deploy
      - run: pnpm --filter backend test:integration

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend db:generate
      - run: pnpm build

  docker-images:
    name: Docker images (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, architecture]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: deploy/docker/Dockerfile.backend
            target: runtime
            build_args: ""
          - image: admin
            dockerfile: deploy/docker/Dockerfile.next
            target: ""
            build_args: "APP=admin"
          - image: business
            dockerfile: deploy/docker/Dockerfile.next
            target: ""
            build_args: "APP=business"
          - image: learning
            dockerfile: deploy/docker/Dockerfile.next
            target: ""
            build_args: "APP=learning"
    env:
      # Poussée vers un registre uniquement sur main ET si les secrets sont configurés (sinon : build seul).
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      IMAGE_NAMESPACE: ${{ secrets.DOCKER_IMAGE_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Décider de la publication
        id: publish
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ] \
             && [ -n "$REGISTRY" ] && [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_TOKEN" ] && [ -n "$IMAGE_NAMESPACE" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Connexion au registre
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}
      - name: Build${{ steps.publish.outputs.push == 'true' && ' et push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build_args }}
            NEXT_PUBLIC_API_URL=https://api.example.invalid/v1
            NEXT_PUBLIC_APP_BASE_DOMAIN=example.invalid
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.publish.outputs.push == 'true' && format('{0}/{1}/saas-lms-{2}:{3}', env.REGISTRY, env.IMAGE_NAMESPACE, matrix.image, github.sha) || format('saas-lms-{0}:ci', matrix.image) }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
